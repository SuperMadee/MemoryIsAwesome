<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Memory taxonomy</title><desc id="d">A three by three grid of memory forms (token-level, parametric, latent) against memory functions (factual, experiential, working), with example systems in each cell highlighted in turn.</desc>
