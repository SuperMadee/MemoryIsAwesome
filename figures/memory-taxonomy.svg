text{fill:#1f2328} .m{fill:#656d76} .h{font-weight:600}
.cell{opacity:0;animation:c 9s ease-in-out infinite}@keyframes c{0%,1%{opacity:0}4%,10%{opacity:1}14%,100%{opacity:0}}
