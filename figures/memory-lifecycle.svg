<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Memory dynamics</title><desc id="d">Experience flows from the agent into memory formation, then evolution, then retrieval, and retrieved memories return to the agent.</desc>
<style>
text{fill:#1f2328} .m{fill:#656d76} .h{font-weight:600}
.lit{opacity:0;animation:lit 6s ease-in-out infinite}@keyframes lit{0%,4%{opacity:0}10%,30%{opacity:1}38%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .mv{display:none}}
</style>
<rect x="1" y="1" width="838" height="278" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><text x="40" y="42" font-size="18" class="h">Memory dynamics: how memory evolves</text>
<rect x="40" y="108" width="130" height="84" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="105" y="146" text-anchor="middle" font-size="15" class="h">Agent</text><text x="105" y="166" text-anchor="middle" font-size="12" class="m">acts and observes</text>
<rect x="250" y="84" width="160" height="132" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="lit" style="animation-delay:0s" x="250" y="84" width="160" height="132" rx="10" fill="#0969da" fill-opacity=".10" stroke="#0969da" stroke-width="2"/><text x="330" y="112" text-anchor="middle" font-size="16" class="h" style="fill:#0969da">Formation</text><text x="330" y="131" text-anchor="middle" font-size="12" class="m">W · writing</text><text x="330" y="158" text-anchor="middle" font-size="12.5">direct storage</text><text x="330" y="177" text-anchor="middle" font-size="12.5">summarization</text><text x="330" y="196" text-anchor="middle" font-size="12.5">structured extraction</text>
<rect x="440" y="84" width="160" height="132" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="lit" style="animation-delay:2s" x="440" y="84" width="160" height="132" rx="10" fill="#bc4c00" fill-opacity=".10" stroke="#bc4c00" stroke-width="2"/><text x="520" y="112" text-anchor="middle" font-size="16" class="h" style="fill:#bc4c00">Evolution</text><text x="520" y="131" text-anchor="middle" font-size="12" class="m">P · management</text><text x="520" y="158" text-anchor="middle" font-size="12.5">consolidation</text><text x="520" y="177" text-anchor="middle" font-size="12.5">forgetting</text><text x="520" y="196" text-anchor="middle" font-size="12.5">reflection</text>
<rect x="630" y="84" width="160" height="132" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="lit" style="animation-delay:4s" x="630" y="84" width="160" height="132" rx="10" fill="#1a7f37" fill-opacity=".10" stroke="#1a7f37" stroke-width="2"/><text x="710" y="112" text-anchor="middle" font-size="16" class="h" style="fill:#1a7f37">Retrieval</text><text x="710" y="131" text-anchor="middle" font-size="12" class="m">R · reading</text><text x="710" y="158" text-anchor="middle" font-size="12.5">recency</text><text x="710" y="177" text-anchor="middle" font-size="12.5">relevance</text><text x="710" y="196" text-anchor="middle" font-size="12.5">importance</text>
<path id="a0" d="M170 150L250 150" stroke="#d0d7de" stroke-width="2" fill="none" marker-end="url(#ar)"/><circle class="mv" r="4.5" fill="#0969da"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath href="#a0"/></animateMotion></circle>
<path id="a1" d="M410 150L440 150" stroke="#d0d7de" stroke-width="2" fill="none" marker-end="url(#ar)"/><circle class="mv" r="4.5" fill="#bc4c00"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
<path id="a2" d="M600 150L630 150" stroke="#d0d7de" stroke-width="2" fill="none" marker-end="url(#ar)"/><circle class="mv" r="4.5" fill="#1a7f37"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
<path id="a3" d="M710 216C710 256 105 256 105 192" stroke="#d0d7de" stroke-width="2" fill="none" marker-end="url(#ar)"/><circle class="mv" r="4.5" fill="#1a7f37"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
<text x="210" y="138" text-anchor="middle" font-size="11.5" class="m">experience</text><text x="408" y="268" text-anchor="middle" font-size="11.5" class="m">retrieved memories return to the agent's context</text>
